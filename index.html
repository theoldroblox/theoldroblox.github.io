<!DOCTYPE html>
<html>
<head>
    <title>Roblox 2016</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }

        /* Shift Lock Cursor Styling */
        #shiftlock-cursor {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px; /* Standard Roblox cursor size */
            height: 32px;
            display: none; /* Hidden by default */
            pointer-events: none; /* Prevents clicking the image */
            z-index: 10;
            image-rendering: pixelated; /* Keeps the classic look sharp */
        }
    </style>
</head>
<body>
    <img id="shiftlock-cursor" src="https://raw.githubusercontent.com/theoldroblox/data/main/MouseLockedCursor.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const WALK_SPEED = 16;
        const JUMP_POWER = 50;
        const GRAVITY = -150;
        const CHAR_H = 5;
        const BP_SIZE = 512;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Get reference to the cursor element
        const shiftLockIcon = document.getElementById('shiftlock-cursor');

        const BASE_URL = 'https://raw.githubusercontent.com/theoldroblox/data/main/';
        const faceConfig = [
            { url: BASE_URL + 'null_plainsky512_rt.jpg', rot: 0 },
            { url: BASE_URL + 'null_plainsky512_lf.jpg', rot: 0 },
            { url: BASE_URL + 'null_plainsky512_up.jpg', rot: -90 },
            { url: BASE_URL + 'null_plainsky512_dn.jpg', rot: 90 },
            { url: BASE_URL + 'null_plainsky512_bk.jpg', rot: 0 },
            { url: BASE_URL + 'null_plainsky512_ft.jpg', rot: 0 }
        ];

        const faceImages = new Array(6);
        let loadedCount = 0;
        faceConfig.forEach((cfg, i) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                if (cfg.rot === 0) {
                    faceImages[i] = img;
                } else {
                    const c = document.createElement('canvas');
                    c.width = img.width; c.height = img.height;
                    const ctx = c.getContext('2d');
                    ctx.translate(c.width / 2, c.height / 2);
                    ctx.rotate(cfg.rot * Math.PI / 180);
                    ctx.drawImage(img, -img.width / 2, -img.height / 2);
                    faceImages[i] = c;
                }
                if (++loadedCount === 6) {
                    const sky = new THREE.CubeTexture(faceImages);
                    sky.needsUpdate = true;
                    scene.background = sky;
                }
            };
            img.src = cfg.url;
        });

        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#2E6B2A'; ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = '#3A7D36'; ctx.fillRect(32, 32, 64, 64);
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(BP_SIZE, BP_SIZE);

        const bp = new THREE.Mesh(new THREE.BoxGeometry(BP_SIZE, 2.4, BP_SIZE), [
            new THREE.MeshStandardMaterial({color: 0x2E6B2A}), new THREE.MeshStandardMaterial({color: 0x2E6B2A}),
            new THREE.MeshStandardMaterial({map: tex}), new THREE.MeshStandardMaterial({color: 0x2E6B2A}),
            new THREE.MeshStandardMaterial({color: 0x2E6B2A}), new THREE.MeshStandardMaterial({color: 0x2E6B2A})
        ]);
        bp.position.y = -1.2;
        scene.add(bp);

        const character = new THREE.Mesh(
            new THREE.BoxGeometry(2, CHAR_H, 1),
            new THREE.MeshStandardMaterial({ color: 0xA3A2A5 })
        );
        character.position.set(0, CHAR_H / 2, 0);
        scene.add(character);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x1C4A1A, 1.0));

        let yaw = -Math.PI / 4, pitch = -Math.PI / 8;
        let zoom = 15;
        let velY = 0;
        let isGrounded = true;
        let isShiftLock = false;
        const keys = { w: false, a: false, s: false, d: false, ' ': false };
        let isRightMouseDown = false;

        window.addEventListener('mousedown', e => { if (e.button === 2) isRightMouseDown = true; });
        window.addEventListener('mouseup', e => { if (e.button === 2) isRightMouseDown = false; });
        window.addEventListener('mousemove', e => {
            if (isRightMouseDown || document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * 0.005;
                pitch -= e.movementY * 0.005;
                pitch = Math.max(-Math.PI / 2.01, Math.min(Math.PI / 2.01, pitch));
            }
        });
        window.addEventListener('wheel', e => {
            let oldZoom = zoom;
            zoom = Math.max(0, Math.min(100, zoom + (e.deltaY > 0 ? 2 : -2)));
            
            if (zoom <= 0.5 && oldZoom > 0.5) {
                renderer.domElement.requestPointerLock();
            } else if (zoom > 0.5 && oldZoom <= 0.5 && !isShiftLock) {
                document.exitPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement !== renderer.domElement) {
                if (zoom <= 0.5) {
                    zoom = 2;
                }
                isShiftLock = false;
            }
        });

        window.addEventListener('keydown', e => { 
            const k = e.key.toLowerCase();
            if (k === 'shift') {
                isShiftLock = !isShiftLock;
                if (isShiftLock) {
                    renderer.domElement.requestPointerLock();
                } else if (zoom > 0.5) {
                    document.exitPointerLock();
                }
            }
            if (k in keys) keys[k] = true; 
        });
        window.addEventListener('keyup', e => { 
            const k = e.key.toLowerCase();
            if (k in keys) keys[k] = false; 
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        const clock = new THREE.Clock();

        function update() {
            const dt = clock.getDelta();

            if (!isGrounded) {
                velY += GRAVITY * dt;
                character.position.y += velY * dt;
                if (character.position.y <= CHAR_H / 2) {
                    character.position.y = CHAR_H / 2;
                    velY = 0;
                    isGrounded = true;
                }
            }
            if (keys[' '] && isGrounded) {
                velY = JUMP_POWER;
                isGrounded = false;
            }

            const moveDir = new THREE.Vector3();
            const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

            if (keys.w) moveDir.sub(forward);
            if (keys.s) moveDir.add(forward);
            if (keys.a) moveDir.sub(right);
            if (keys.d) moveDir.add(right);

            const isFP = zoom <= 0.5;

            // Toggle Shift Lock Cursor Visibility
            shiftLockIcon.style.display = (isShiftLock && !isFP) ? 'block' : 'none';

            if (moveDir.length() > 0) {
                moveDir.normalize();
                character.position.x += moveDir.x * WALK_SPEED * dt;
                character.position.z += moveDir.z * WALK_SPEED * dt;
                
                if (!isFP && !isShiftLock) {
                    const targetRot = Math.atan2(moveDir.x, moveDir.z);
                    let diff = targetRot - character.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    character.rotation.y += diff * 0.45; 
                }
            }

            character.visible = !isFP;

            if (isFP || isShiftLock) {
                character.rotation.y = yaw + Math.PI;
            }

            const camX = Math.sin(yaw) * Math.cos(pitch) * zoom;
            const camY = -Math.sin(pitch) * zoom;
            const camZ = Math.cos(yaw) * Math.cos(pitch) * zoom;
            const eyeLevel = 1.8; 

            let targetX = character.position.x;
            let targetY = character.position.y + eyeLevel;
            let targetZ = character.position.z;

            if (isShiftLock && !isFP) {
                targetX += right.x * 1.75;
                targetZ += right.z * 1.75;
            }

            camera.position.set(
                targetX + camX,
                targetY + camY,
                targetZ + camZ
            );

            if (isFP) {
                const fpLook = new THREE.Vector3(
                    camera.position.x - Math.sin(yaw) * Math.cos(pitch),
                    camera.position.y + Math.sin(pitch),
                    camera.position.z - Math.cos(yaw) * Math.cos(pitch)
                );
                camera.lookAt(fpLook);
            } else {
                camera.lookAt(targetX, targetY, targetZ);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
