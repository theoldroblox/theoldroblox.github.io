<!DOCTYPE html>
<html>
<head>
    <title>Roblox 2016 Baseplate</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x5EB1FF);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(100, 60, 100);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const cubeLoader = new THREE.CubeTextureLoader();
        cubeLoader.load(
            [
                'sky/sky_rt.jpg',
                'sky/sky_lf.jpg',
                'sky/sky_up.jpg',
                'sky/sky_dn.jpg',
                'sky/sky_ft.jpg',
                'sky/sky_bk.jpg'
            ],
            function (cubeTexture) {
                cubeTexture.minFilter = THREE.LinearFilter;
                cubeTexture.magFilter = THREE.LinearFilter;
                cubeTexture.generateMipmaps = false;
                cubeTexture.needsUpdate = true;
                scene.background = cubeTexture;
            },
            undefined,
            function () {
                scene.background = new THREE.Color(0x5EB1FF);
            }
        );

        function createStudTexture() {
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#3A3A3A';
            ctx.fillRect(0, 0, size, size);

            const studSize = size * 0.5;
            const offset = (size - studSize) / 2;
            const radius = 6;

            ctx.fillStyle = '#1A1A1A';
            roundRect(ctx, offset + 4, offset + 4, studSize + 2, studSize + 2, radius);
            ctx.fill();

            ctx.fillStyle = '#3A3A3A';
            roundRect(ctx, offset, offset, studSize, studSize, radius);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 2;
            roundRect(ctx, offset, offset, studSize, studSize, radius);
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(128, 128);
            return texture;
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        const bpSize = 512;
        const bpThickness = 4;
        const geometry = new THREE.BoxGeometry(bpSize, bpThickness, bpSize);
        const studTexture = createStudTexture();
        const sideMaterial = new THREE.MeshStandardMaterial({ color: 0x3A3A3A, roughness: 0.8 });
        const topMaterial = new THREE.MeshStandardMaterial({ map: studTexture, roughness: 0.7, metalness: 0.0 });
        const materials = [sideMaterial, sideMaterial, topMaterial, sideMaterial, sideMaterial, sideMaterial];
        const baseplate = new THREE.Mesh(geometry, materials);
        baseplate.position.y = -bpThickness / 2;
        scene.add(baseplate);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.9);
        scene.add(hemiLight);
        const sun = new THREE.DirectionalLight(0xffffff, 0.6);
        sun.position.set(100, 200, 50);
        scene.add(sun);

        let isRightMouseDown = false;
        const keys = { w: false, a: false, s: false, d: false, q: false, e: false };
        let yaw = -Math.PI / 4;
        let pitch = -Math.PI / 6;

        window.addEventListener('mousedown',   (e) => { if (e.button === 2) isRightMouseDown = true; });
        window.addEventListener('mouseup',     (e) => { if (e.button === 2) isRightMouseDown = false; });
        window.addEventListener('mousemove',   (e) => {
            if (isRightMouseDown) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
            }
        });
        window.addEventListener('keydown',     (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup',       (e) => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });
        window.addEventListener('contextmenu', (e) => e.preventDefault());

        function update() {
            camera.rotation.order = 'YXZ';
            camera.rotation.set(pitch, yaw, 0);
            const moveSpeed = 1.5;
            const dir = new THREE.Vector3();
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            if (keys.w) dir.add(forward);
            if (keys.s) dir.sub(forward);
            if (keys.a) dir.sub(right);
            if (keys.d) dir.add(right);
            if (keys.e) camera.position.y += moveSpeed;
            if (keys.q) camera.position.y -= moveSpeed;
            if (dir.length() > 0) camera.position.add(dir.normalize().multiplyScalar(moveSpeed));
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
